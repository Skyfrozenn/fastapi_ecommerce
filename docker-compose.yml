services:
  web:
    build:
      context: .
      dockerfile: app/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --reload
    ports:
      - 8000:8000
    volumes:
      - ./:/home/fast
    depends_on:
      - db
      - redis
    env_file:
      - .env  # DATABASE_URL + YOOKASSA_* for FastAPI

  db:
    image: postgres:17
    env_file:
      - .env  # POSTGRES_* variables for PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5433:5432"  # local access

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]

volumes:
  postgres_data:
  redis_data:
